<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fonti Prealpi</title>

  <style>
    /* ============ STILE GENERALE ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #eef3f2;
      --card: #ffffff;
      --text: #1b2a2a;
      --muted: #637373;
      --star-off: #d3dad9;
      --star-on: #fbbc04;      /* giallo/oro */
      --accent: #1f5f5b;       /* verde-azzurro "acqua di montagna" */
      --border: #dbe3e2;
    }

    html, body { min-height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #e3eeed 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 24px;
      padding: 28px 24px 28px;
      box-shadow: 0 10px 35px rgba(31, 95, 91, 0.10);
      text-align: center;
    }

    /* ============ SELETTORE LINGUA ============ */
    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 22px;
    }
    .lang-btn {
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ============ INTESTAZIONE ATTIVITÀ ============ */
    .brand {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--accent);
      line-height: 1.1;
    }
    .brand-line {
      width: 44px;
      height: 3px;
      background: var(--star-on);
      border-radius: 3px;
      margin: 12px auto 16px;
    }
    .welcome {
      color: var(--muted);
      font-size: 0.98rem;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 26px;
    }

    /* ============ STELLE ============ */
    .stars {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 8px;
    }

    .star {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      width: 58px;
      height: 58px;
      transition: transform 0.2s cubic-bezier(.34, 1.56, .64, 1);
    }

    .star svg {
      width: 100%;
      height: 100%;
      fill: var(--star-off);
      transition: fill 0.2s ease;
    }

    .star.active svg { fill: var(--star-on); }
    .star.active { transform: scale(1.15); }

    /* Animazione "pop" al click */
    .star.pop { animation: pop 0.45s ease; }
    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.45) rotate(-12deg); }
      100% { transform: scale(1.15) rotate(0); }
    }

    /* ============ MODULO FEEDBACK ============ */
    #feedback-section { display: none; }
    #feedback-section.show {
      display: block;
      animation: slideUp 0.45s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .sorry-title { font-size: 1.35rem; font-weight: 700; margin: 8px 0 6px; }
    .sorry-text  { color: var(--muted); margin-bottom: 20px; }

    textarea, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;           /* 16px evita lo zoom automatico su iPhone */
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: #f8fafa;
      color: var(--text);
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    textarea { min-height: 130px; resize: vertical; }
    textarea:focus, input:focus { border-color: var(--accent); background: #fff; }

    .btn {
      width: 100%;
      padding: 17px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; }

    .error { color: #c62828; font-size: 0.9rem; margin-bottom: 12px; display: none; }

    /* ============ MESSAGGIO DI RINGRAZIAMENTO ============ */
    #thanks-section { display: none; animation: slideUp 0.45s ease; }
    #thanks-section.show { display: block; }
    .check {
      width: 70px; height: 70px; border-radius: 50%;
      background: #e3f1ee; color: var(--accent);
      font-size: 2.2rem; line-height: 70px;
      margin: 10px auto 18px;
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- ===== SELETTORE LINGUA ===== -->
    <div class="lang-switch" id="lang-switch"></div>

    <!-- ===== INTESTAZIONE ===== -->
    <header>
      <div class="brand">Fonti Prealpi</div>
      <div class="brand-line"></div>
    </header>

    <!-- ===== SCHERMATA 1: VALUTAZIONE ===== -->
    <section id="rating-section">
      <p class="welcome" data-i18n="welcome"></p>
      <h1 data-i18n="question"></h1>
      <p class="subtitle" data-i18n="tap"></p>

      <div class="stars" id="stars" role="radiogroup"></div>
    </section>

    <!-- ===== SCHERMATA 2: FEEDBACK PRIVATO (1-3 stelle) ===== -->
    <section id="feedback-section">
      <h2 class="sorry-title" data-i18n="sorryTitle"></h2>
      <p class="sorry-text" data-i18n="sorryText"></p>

      <form id="feedback-form">
        <textarea id="message" name="message" required data-i18n-placeholder="messagePh"></textarea>
        <input type="text" id="contact" name="contact" autocomplete="email" data-i18n-placeholder="contactPh">
        <p class="error" id="error-msg" data-i18n="error"></p>
        <button type="submit" class="btn" id="submit-btn" data-i18n="send"></button>
      </form>
    </section>

    <!-- ===== SCHERMATA 3: GRAZIE ===== -->
    <section id="thanks-section">
      <div class="check">✓</div>
      <h2 class="sorry-title" data-i18n="thanksTitle"></h2>
      <p class="sorry-text" data-i18n="thanksText"></p>
    </section>

  </main>

  <script>
    /* ============ CONFIGURAZIONE ============ */
    // Link Google Recensioni (per 4 e 5 stelle)
    const GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJ21zG6mhUgUcRqqX3m2la1ng";

    // Endpoint Formspree a cui vengono inviati i feedback privati
    const FEEDBACK_ENDPOINT = "https://formspree.io/f/xdeewglj";

    /* ============ TRADUZIONI ============ */
    // Per aggiungere una lingua basta aggiungere un blocco qui sotto
    const TEXTS = {
      it: {
        label: "IT",
        welcome: "Grazie per aver scelto Fonti Prealpi.",
        question: "Come è stata la tua esperienza?",
        tap: "Tocca una stella per valutare",
        starLabel: ["1 stella", "2 stelle", "3 stelle", "4 stelle", "5 stelle"],
        sorryTitle: "Ci dispiace molto!",
        sorryText: "Cosa possiamo migliorare? Il tuo messaggio arriva direttamente a noi.",
        messagePh: "Raccontaci cosa è andato storto...",
        contactPh: "Email o telefono (facoltativo)",
        send: "Invia Feedback",
        sending: "Invio in corso...",
        error: "Qualcosa è andato storto. Riprova tra poco.",
        thanksTitle: "Grazie per il tuo feedback",
        thanksText: "Lo leggeremo con attenzione per migliorare."
      },
      en: {
        label: "EN",
        welcome: "Thank you for choosing Fonti Prealpi.",
        question: "How was your experience?",
        tap: "Tap a star to rate",
        starLabel: ["1 star", "2 stars", "3 stars", "4 stars", "5 stars"],
        sorryTitle: "We're so sorry!",
        sorryText: "What can we improve? Your message goes straight to us.",
        messagePh: "Tell us what went wrong...",
        contactPh: "Email or phone (optional)",
        send: "Send Feedback",
        sending: "Sending...",
        error: "Something went wrong. Please try again shortly.",
        thanksTitle: "Thank you for your feedback",
        thanksText: "We will read it carefully to improve."
      },
      de: {
        label: "DE",
        welcome: "Danke, dass Sie sich für Fonti Prealpi entschieden haben.",
        question: "Wie war Ihre Erfahrung?",
        tap: "Tippen Sie auf einen Stern zum Bewerten",
        starLabel: ["1 Stern", "2 Sterne", "3 Sterne", "4 Sterne", "5 Sterne"],
        sorryTitle: "Das tut uns sehr leid!",
        sorryText: "Was können wir verbessern? Ihre Nachricht geht direkt an uns.",
        messagePh: "Erzählen Sie uns, was schiefgelaufen ist...",
        contactPh: "E-Mail oder Telefon (optional)",
        send: "Feedback senden",
        sending: "Wird gesendet...",
        error: "Etwas ist schiefgelaufen. Bitte versuchen Sie es gleich noch einmal.",
        thanksTitle: "Vielen Dank für Ihr Feedback",
        thanksText: "Wir lesen es sorgfältig, um uns zu verbessern."
      },
      fr: {
        label: "FR",
        welcome: "Merci d'avoir choisi Fonti Prealpi.",
        question: "Comment était votre expérience ?",
        tap: "Touchez une étoile pour noter",
        starLabel: ["1 étoile", "2 étoiles", "3 étoiles", "4 étoiles", "5 étoiles"],
        sorryTitle: "Nous sommes vraiment désolés !",
        sorryText: "Que pouvons-nous améliorer ? Votre message nous arrive directement.",
        messagePh: "Dites-nous ce qui n'a pas été...",
        contactPh: "E-mail ou téléphone (facultatif)",
        send: "Envoyer le feedback",
        sending: "Envoi en cours...",
        error: "Une erreur s'est produite. Veuillez réessayer dans un instant.",
        thanksTitle: "Merci pour votre avis",
        thanksText: "Nous le lirons attentivement pour nous améliorer."
      }
    };

    /* ============ GESTIONE LINGUA ============ */
    let currentLang = "it";

    // Sceglie la lingua in base al telefono; se non è disponibile usa l'italiano
    function detectLang() {
      const browserLang = (navigator.language || "it").slice(0, 2).toLowerCase();
      return TEXTS[browserLang] ? browserLang : "it";
    }

    // Applica le traduzioni a tutti gli elementi della pagina
    function applyLang(lang) {
      currentLang = lang;
      const t = TEXTS[lang];
      document.documentElement.lang = lang;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        el.textContent = t[el.dataset.i18n];
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
        el.placeholder = t[el.dataset.i18nPlaceholder];
      });

      // Etichette accessibili delle stelle
      stars.forEach((s, i) => s.setAttribute("aria-label", t.starLabel[i]));

      // Evidenzia il pulsante lingua attivo
      document.querySelectorAll(".lang-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.lang === lang);
      });
    }

    // Crea i pulsanti di scelta lingua
    const langSwitch = document.getElementById("lang-switch");
    Object.keys(TEXTS).forEach(code => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "lang-btn";
      b.dataset.lang = code;
      b.textContent = TEXTS[code].label;
      b.addEventListener("click", () => applyLang(code));
      langSwitch.appendChild(b);
    });

    /* ============ CREAZIONE DELLE 5 STELLE ============ */
    const starsContainer = document.getElementById("stars");
    const starSVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.6l-5.9 3.1 1.2-6.6L2.5 9.5l6.6-.9z" stroke-linejoin="round"/></svg>`;
    const stars = [];

    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "star";
      btn.dataset.value = i;
      btn.setAttribute("role", "radio");
      btn.innerHTML = starSVG;
      starsContainer.appendChild(btn);
      stars.push(btn);
    }

    // Accende le stelle fino al valore indicato
    function highlight(value) {
      stars.forEach(s => s.classList.toggle("active", Number(s.dataset.value) <= value));
    }

    let locked = false;       // evita doppi click dopo la scelta
    let chosenRating = 0;     // valutazione scelta

    stars.forEach(star => {
      const value = Number(star.dataset.value);

      // Anteprima al passaggio del mouse (desktop)
      star.addEventListener("mouseenter", () => { if (!locked) highlight(value); });
      starsContainer.addEventListener("mouseleave", () => { if (!locked) highlight(0); });

      // Anteprima al tocco (mobile)
      star.addEventListener("touchstart", () => { if (!locked) highlight(value); }, { passive: true });

      // Click / tap
      star.addEventListener("click", () => {
        if (locked) return;
        locked = true;
        chosenRating = value;
        highlight(value);

        // Animazione "pop"
        star.classList.add("pop");

        if (value >= 4) {
          // 4-5 stelle: breve pausa per vedere l'animazione, poi redirect a Google
          setTimeout(() => { window.location.href = GOOGLE_REVIEW_URL; }, 450);
        } else {
          // 1-3 stelle: mostra il modulo di feedback privato
          setTimeout(() => {
            document.getElementById("feedback-section").classList.add("show");
            document.getElementById("message").focus();
          }, 450);
        }
      });
    });

    /* ============ INVIO DEL FEEDBACK ============ */
    const form = document.getElementById("feedback-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorMsg = document.getElementById("error-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = TEXTS[currentLang].sending;

      // Dati da inviare
      const payload = {
        rating: chosenRating,
        message: document.getElementById("message").value.trim(),
        contact: document.getElementById("contact").value.trim(),
        language: currentLang
      };

      try {
        // Invio a Formspree
        const res = await fetch(FEEDBACK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("Errore server");

        // Mostra il ringraziamento
        document.getElementById("rating-section").style.display = "none";
        document.getElementById("feedback-section").classList.remove("show");
        document.getElementById("thanks-section").classList.add("show");

      } catch (err) {
        errorMsg.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = TEXTS[currentLang].send;
      }
    });

    /* ============ AVVIO ============ */
    applyLang(detectLang());
  </script>
</body>
</html>
