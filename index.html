<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La tua opinione</title>

  <style>
    /* ============ STILE GENERALE ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --star-off: #d4d6db;
      --star-on: #fbbc04;      /* giallo/oro */
      --accent: #1d1d1f;
      --border: #e3e5e8;
    }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border-radius: 24px;
      padding: 40px 24px 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 32px;
    }

    /* ============ STELLE ============ */
    .stars {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .star {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      width: 58px;
      height: 58px;
      transition: transform 0.2s cubic-bezier(.34, 1.56, .64, 1);
    }

    .star svg {
      width: 100%;
      height: 100%;
      fill: var(--star-off);
      transition: fill 0.2s ease;
    }

    .star.active svg { fill: var(--star-on); }
    .star.active { transform: scale(1.15); }

    /* Animazione "pop" al click */
    .star.pop { animation: pop 0.45s ease; }
    @keyframes pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.45) rotate(-12deg); }
      100% { transform: scale(1.15) rotate(0); }
    }

    /* ============ MODULO FEEDBACK ============ */
    #feedback-section { display: none; }
    #feedback-section.show {
      display: block;
      animation: slideUp 0.45s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .sorry-title { font-size: 1.35rem; font-weight: 700; margin: 24px 0 6px; }
    .sorry-text  { color: var(--muted); margin-bottom: 20px; }

    textarea, input[type="text"] {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;           /* 16px evita lo zoom automatico su iPhone */
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: 14px;
      background: #fafafa;
      color: var(--text);
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    textarea { min-height: 130px; resize: vertical; }
    textarea:focus, input:focus { border-color: var(--accent); background: #fff; }

    .btn {
      width: 100%;
      padding: 17px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; }

    .error { color: #c62828; font-size: 0.9rem; margin-bottom: 12px; display: none; }

    /* ============ MESSAGGIO DI RINGRAZIAMENTO ============ */
    #thanks-section { display: none; animation: slideUp 0.45s ease; }
    #thanks-section.show { display: block; }
    .check {
      width: 70px; height: 70px; border-radius: 50%;
      background: #e8f5e9; color: #2e7d32;
      font-size: 2.2rem; line-height: 70px;
      margin: 10px auto 18px;
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- ===== SCHERMATA 1: VALUTAZIONE ===== -->
    <section id="rating-section">
      <h1>Come è stata la tua esperienza?</h1>
      <p class="subtitle">Tocca una stella per valutare</p>

      <div class="stars" id="stars" role="radiogroup" aria-label="Valutazione da 1 a 5 stelle"></div>
    </section>

    <!-- ===== SCHERMATA 2: FEEDBACK PRIVATO (1-3 stelle) ===== -->
    <section id="feedback-section">
      <h2 class="sorry-title">Ci dispiace molto!</h2>
      <p class="sorry-text">Cosa possiamo migliorare? Il tuo messaggio arriva direttamente a noi.</p>

      <form id="feedback-form">
        <textarea id="message" name="message" placeholder="Raccontaci cosa è andato storto..." required></textarea>
        <input type="text" id="contact" name="contact" placeholder="Email o telefono (facoltativo)" autocomplete="email">
        <p class="error" id="error-msg">Qualcosa è andato storto. Riprova tra poco.</p>
        <button type="submit" class="btn" id="submit-btn">Invia Feedback</button>
      </form>
    </section>

    <!-- ===== SCHERMATA 3: GRAZIE ===== -->
    <section id="thanks-section">
      <div class="check">✓</div>
      <h2 class="sorry-title">Grazie per il tuo feedback</h2>
      <p class="sorry-text">Lo leggeremo con attenzione per migliorare.</p>
    </section>

  </main>

  <script>
    /* ============ CONFIGURAZIONE ============ */
    // Link Google Recensioni (per 4 e 5 stelle)
    const GOOGLE_REVIEW_URL = "https://search.google.com/local/writereview?placeid=ChIJ21zG6mhUgUcRqqX3m2la1ng";

    // Endpoint Formspree a cui vengono inviati i feedback privati
    const FEEDBACK_ENDPOINT = "https://formspree.io/f/xdeewglj";

    /* ============ CREAZIONE DELLE 5 STELLE ============ */
    const starsContainer = document.getElementById("stars");
    const starSVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17.6l-5.9 3.1 1.2-6.6L2.5 9.5l6.6-.9z" stroke-linejoin="round"/></svg>`;
    const stars = [];

    for (let i = 1; i <= 5; i++) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "star";
      btn.dataset.value = i;
      btn.setAttribute("role", "radio");
      btn.setAttribute("aria-label", i + (i === 1 ? " stella" : " stelle"));
      btn.innerHTML = starSVG;
      starsContainer.appendChild(btn);
      stars.push(btn);
    }

    // Accende le stelle fino al valore indicato
    function highlight(value) {
      stars.forEach(s => s.classList.toggle("active", Number(s.dataset.value) <= value));
    }

    let locked = false; // evita doppi click dopo la scelta

    stars.forEach(star => {
      const value = Number(star.dataset.value);

      // Anteprima al passaggio del mouse (desktop)
      star.addEventListener("mouseenter", () => { if (!locked) highlight(value); });
      starsContainer.addEventListener("mouseleave", () => { if (!locked) highlight(0); });

      // Anteprima al tocco (mobile)
      star.addEventListener("touchstart", () => { if (!locked) highlight(value); }, { passive: true });

      // Click / tap
      star.addEventListener("click", () => {
        if (locked) return;
        locked = true;
        highlight(value);

        // Animazione "pop"
        star.classList.add("pop");

        if (value >= 4) {
          // 4-5 stelle: breve pausa per vedere l'animazione, poi redirect a Google
          setTimeout(() => { window.location.href = GOOGLE_REVIEW_URL; }, 450);
        } else {
          // 1-3 stelle: mostra il modulo di feedback privato
          setTimeout(() => {
            document.getElementById("feedback-section").classList.add("show");
            document.getElementById("message").focus({ preventScroll: false });
          }, 450);
        }
      });
    });

    /* ============ INVIO DEL FEEDBACK ============ */
    const form = document.getElementById("feedback-form");
    const submitBtn = document.getElementById("submit-btn");
    const errorMsg = document.getElementById("error-msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Invio in corso...";

      // Dati da inviare
      const rating = stars.filter(s => s.classList.contains("active")).length;
      const payload = {
        rating: rating,
        message: document.getElementById("message").value.trim(),
        contact: document.getElementById("contact").value.trim()
      };

      try {
        // Invio a Formspree
        const res = await fetch(FEEDBACK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error("Errore server");

        // Mostra il ringraziamento
        document.getElementById("rating-section").style.display = "none";
        document.getElementById("feedback-section").classList.remove("show");
        document.getElementById("thanks-section").classList.add("show");

      } catch (err) {
        errorMsg.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Invia Feedback";
      }
    });
  </script>
</body>
</html>
